# Builds the runtime image on every push to main and pushes it to the GitHub
# Container Registry. Coolify never builds anything itself — it pulls this image.
#
# One image, not two: the container migrates the schema on start
# (scripts/start.sh), so the separate `migrate` image is gone. That also halves
# the pushes to GHCR, which hit a secondary rate limit on 2026-08-04 and left a
# half-updated pair of images on the server.
#
# The deploy is triggered from HERE, at the end of a successful build. Coolify's
# own "auto-deploy on push" must stay OFF: it fires seconds after the push, long
# before this image exists.
#
# Optional repo secrets for auto-redeploy after a successful build:
#   COOLIFY_WEBHOOK — the app's deploy webhook URL (Coolify → app → Webhooks)
#   COOLIFY_TOKEN   — Coolify API token (Keys & Tokens → API tokens)
# Without them the workflow still builds; trigger the deploy manually in Coolify.

name: build-images

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-web:latest
            ghcr.io/${{ github.repository }}-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


      - name: Trigger Coolify redeploy (optional)
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$COOLIFY_WEBHOOK" ]; then
            echo "Secret COOLIFY_WEBHOOK not set — trigger the deploy manually in Coolify."
            exit 0
          fi
          curl -fsS "$COOLIFY_WEBHOOK" -H "Authorization: Bearer $COOLIFY_TOKEN"
