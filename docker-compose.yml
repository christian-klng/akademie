# Postgres for the Kubikraum Akademie — and nothing else.
#
# The app itself is NOT here any more. It runs as a Coolify *Application*
# resource pulling ghcr.io/christian-klng/akademie-web:latest, because Coolify
# does rolling updates only for applications, never for compose stacks. That
# rebuild is what keeps a failed deploy from taking the site offline; see
# CLAUDE.md → Deployment.
#
# The database deliberately stayed put: same service, same `db-data` volume, no
# dump and restore. `media-data` also lives on here and is mounted into the
# application as persistent storage — the files are never copied anywhere.
#
# Coolify injects env vars from its UI, but ONLY into services whose
# `environment:` block references them. The ${VAR:-default} fallbacks let this
# run locally without a .env file.

services:
  db:
    image: postgres:18
    # Deliberately NO `pull_policy: always`: pulling a new Postgres patch
    # release on every deploy is not something a database should do unattended.
    # Update this one on purpose.
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-akademie}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-akademie}
      POSTGRES_DB: ${POSTGRES_DB:-akademie}
    volumes:
      # postgres:18 images moved the volume mount point: data now lives under
      # /var/lib/postgresql/<major>/docker. Mounting the old …/data path would
      # write the cluster OUTSIDE the volume (data loss on container recreate).
      - db-data:/var/lib/postgresql
    networks:
      coolify:
        # A STABLE name for the application to connect to. Coolify names compose
        # containers `db-<uuid>-<timestamp>` — that changes on every deploy, so
        # a DATABASE_URL pointing at the container name would break on the next
        # one. The alias survives container recreation.
        aliases:
          - akademie-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-akademie}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
  # Holds the uploaded videos and event images, mounted into the application.
  # NOT covered by any backup — keep the original files elsewhere.
  media-data:

networks:
  coolify:
    external: true
