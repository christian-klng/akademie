# Stack for Coolify. The web/migrate images are built by GitHub Actions
# (.github/workflows/build-images.yml) and pushed to ghcr.io — Coolify only
# pulls them, the server never compiles anything. To build locally instead:
# `docker build --target runner -t akademie-web .` (or `--target migrator`).
# Coolify injects env vars from its UI — but ONLY into services whose
# `environment:` block references them. Every var the app needs is therefore
# listed explicitly below. The ${VAR:-default} fallbacks let the stack run
# locally without a .env file.

services:
  db:
    image: postgres:18
    # Deliberately NO `pull_policy: always` here (unlike web/migrate): pulling a
    # new Postgres patch release on every deploy is not something a database
    # should do unattended. Update this one on purpose.
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-akademie}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-akademie}
      POSTGRES_DB: ${POSTGRES_DB:-akademie}
    volumes:
      # postgres:18 images moved the volume mount point: data now lives under
      # /var/lib/postgresql/<major>/docker. Mounting the old …/data path would
      # write the cluster OUTSIDE the volume (data loss on container recreate).
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-akademie}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: applies the drizzle schema (push --force) and runs the idempotent
  # seed (first admin from ADMIN_EMAIL/ADMIN_PASSWORD, static pages, sample event).
  migrate:
    image: ghcr.io/christian-klng/akademie-migrate:latest
    # `latest` is a moving tag: once the host has pulled it, `compose up` reuses
    # the cached copy and never sees a newer push. That silently deploys stale
    # code while the UI still reports the current commit. Always pull instead.
    pull_policy: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-akademie}:${POSTGRES_PASSWORD:-akademie}@db:5432/${POSTGRES_DB:-akademie}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    image: ghcr.io/christian-klng/akademie-web:latest
    # Same moving-tag problem as `migrate` above.
    pull_policy: always
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-akademie}:${POSTGRES_PASSWORD:-akademie}@db:5432/${POSTGRES_DB:-akademie}
      SESSION_SECRET: ${SESSION_SECRET:-dev-only-session-secret-change-me}
      SITE_URL: ${SITE_URL:-https://kubikraum.academy}
      # Quiz evaluation via Cortecs AI. Empty default on purpose: without a key
      # the quiz reports "nicht verfügbar" instead of erroring per answer.
      CORTECS_API_KEY: ${CORTECS_API_KEY:-}
      CORTECS_MODEL: ${CORTECS_MODEL:-claude-haiku-4-5}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "3000:3000"

volumes:
  db-data:
